# Data warehouse de SmartCart Performance Analysis.
#
# Deliberadamente separado del Postgres de la app principal
# (../SmartCart/docker-compose.yml): otro container, otro volumen y otro puerto.
# Si este servicio se cae o se borra el volumen, SmartCart no se entera.
services:
  analytics_db:
    # Postgres pelado: acá no hay búsqueda semántica, así que no hace falta la
    # imagen de pgvector que usa la app principal.
    image: postgres:16
    container_name: smartcart_analytics_db
    restart: unless-stopped
    ports:
      # 5433 en el host. El 5432 ya lo ocupa smartcart_db.
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analytics_pass}
      POSTGRES_DB: ${POSTGRES_DB:-smartcart_analytics}
    volumes:
      - analytics_pgdata:/var/lib/postgresql/data
      # Postgres ejecuta estos .sql en orden alfabético, PERO sólo la primera vez
      # que crea el volumen. Si cambiás el schema, hace falta `docker compose
      # down -v` (borra los datos) o aplicar el cambio a mano con psql.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analytics} -d ${POSTGRES_DB:-smartcart_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  analytics_pgdata:
